<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학교 월간행사표</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style id="appstyle">
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2430;--sub:#6b7280;--line:#e3e6eb;--accent:#2f5bd3;--danger:#d33a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}
.school{font-size:13px;color:var(--sub);font-weight:500}
.ttl-name{border-radius:8px;padding:0 4px;margin-left:-4px}
.ttl-name.editable{cursor:text}.ttl-name.editable:hover{background:#eef2fb;box-shadow:inset 0 -2px 0 #9fb4ea}
.ttl-name.empty{color:#9aa1ad;font-weight:500;white-space:pre}
.ttl-in{font:inherit;font-size:22px;font-weight:700;border:2px solid var(--accent);border-radius:8px;padding:0 8px;width:min(60vw,340px)}
.steps{margin:6px 0 0;padding-left:20px;font-size:13px;line-height:1.7}
.steps code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#f1f3f6;padding:1px 5px;border-radius:4px}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.status{font-size:12px;color:var(--sub)}
.status.err{color:var(--danger)}
.who{font-size:12px;padding:4px 10px;border-radius:999px;background:#eef2fb;color:#2b4a9c}
.who.ro{background:#f3f4f6;color:var(--sub)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f1f3f6}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.icon{padding:5px 8px;line-height:1}
.btn.danger{color:var(--danger)}
.nav{display:flex;align-items:center;gap:6px}
.nav .label{min-width:200px;text-align:center;font-weight:700;font-size:16px}
.grow{flex:1}
.search{border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:150px}
select{border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:#fff}
label.chk{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--sub);cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tablewrap{overflow-x:auto}
table.ev{width:100%;border-collapse:collapse;min-width:940px}
table.ev th{background:#f1f3f6;font-weight:500;color:var(--sub);font-size:12px;text-align:left;padding:8px;border-bottom:1px solid var(--line)}

table.ev tr.day-start td{border-top:1px solid #cfd4dc}
table.ev tr[data-id]{cursor:default}
td.date{width:84px;white-space:nowrap;text-align:center;font-weight:700;font-size:15px;color:#fff;vertical-align:top!important}
td.wd{width:40px;text-align:center;font-weight:700;vertical-align:top!important}
td.title{font-weight:500}
td.act{width:150px;white-space:nowrap;text-align:right}
td.empty{color:#b3b8c2;font-size:12px}
td.cat{width:80px}
td.own{max-width:170px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:5px;background:#eef2fb;color:#2b4a9c;margin-left:6px;white-space:nowrap;vertical-align:1px}
.tag.rep{background:#f1ecfa;color:#6a46a8}
.hol{display:block;font-size:10px;font-weight:500;margin-top:2px}
tr.flash td{animation:flash 1.6s ease}
@keyframes flash{0%{background:#fff3b0}100%{}}
.addrow{display:inline-block;margin-left:4px;vertical-align:1px}
.addrow button{color:#fff;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2);border-radius:50%;width:20px;height:20px;font-size:14px;line-height:16px;padding:0;cursor:pointer}
.addrow button:hover{background:rgba(255,255,255,.45)}
.today-mark{outline:3px solid var(--ink);outline-offset:-3px}
.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.grid .h{padding:8px;text-align:center;font-weight:700;font-size:12px;color:#fff}
.grid .c{min-height:112px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:6px;cursor:pointer;position:relative;min-width:0}
.grid .c:nth-child(7n+1){border-left:0}
.grid .c.out{background:#fafbfc;color:#c2c7cf;cursor:default}
.grid .c:not(.out):hover{background:#f7f9fc}
.grid .n{font-weight:700}
.grid .chip{display:block;font-size:11px;padding:2px 6px;border-radius:5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.grid .chip.cont{opacity:.75}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.ym{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ym h3{margin:0;padding:10px 12px;font-size:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.ym h3:hover{background:#f7f9fc}
.ym h3 small{font-weight:400;color:var(--sub);font-size:12px}
.ym ul{list-style:none;margin:0;padding:6px 12px 10px;font-size:12.5px;max-height:280px;overflow:auto}
.ym li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed #eef0f3}
.ym li b{min-width:46px;font-weight:700;white-space:nowrap}
.ym li.h{color:var(--danger)}
.ym .none{color:#b3b8c2;padding:8px 0}
.scrim{position:fixed;inset:0;background:rgba(20,24,32,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:780px}
.modal.xwide{max-width:1100px}
.modal h2{margin:0 0 14px;font-size:18px}
.modal h4{margin:18px 0 8px;font-size:13px;color:var(--sub);font-weight:500}
.colors{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.colors label{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.colors input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12px;color:var(--sub)}
.field input,.field textarea,.field select,.inp{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
.field textarea{min-height:60px;resize:vertical}
.field input[type=checkbox],.field input[type=radio]{width:auto;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}
.between{justify-content:space-between}
.hint{font-size:12px;color:var(--sub);margin:6px 0}
.box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafbfc}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff}
.chipx{display:inline-flex;align-items:center;gap:4px;background:#eef2fb;color:#2b4a9c;border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px}
.chipx.legacy{background:#f3f4f6;color:#555}
.chipx button{border:0;background:none;cursor:pointer;color:inherit;font-size:14px;line-height:1;padding:0 4px}
.days7{display:flex;gap:4px}
.days7 label{display:flex;align-items:center;justify-content:center;width:34px;height:30px;border:1px solid var(--line);border-radius:7px;cursor:pointer;font-weight:700;font-size:13px;background:#fff}
.days7 input{display:none}
.days7 label.on{color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th{font-weight:500;color:var(--sub);font-size:12px;text-align:left;padding:4px;border-bottom:1px solid var(--line)}
table.mini td{padding:3px 4px;border-bottom:1px solid #f0f1f4}
table.mini input[type=text],table.mini input:not([type]){width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent}
table.mini input:not([type=checkbox]):hover,table.mini input:not([type=checkbox]):focus{border-color:var(--line);background:#fff}
.scrollbox{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pp-prev{background:#8b8f96;border-radius:10px;padding:12px;max-height:56vh;overflow:auto;margin-top:12px}
.pp-prev .pp{zoom:.62}
.pp-prev .pp-page{margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
.toast button{background:none;border:0;color:#9fc0ff;font-weight:700;cursor:pointer}
.ro .edit-only{display:none!important}
.noadmin .admin-only{display:none!important}
@media (max-width:700px){.nav .label{min-width:140px;font-size:15px}h1{font-size:20px}.grid .c{min-height:80px}.grid .chip{font-size:10px}.form{grid-template-columns:1fr}}
</style></head>
<body><div id="main"></div><div id="overlay"></div><div id="toast"></div>
<script id="appdata" type="application/json">{"schoolName":"","colors":{"0":"#e0524f","1":"#e0a018","2":"#e9692c","3":"#3ba55c","4":"#8a5cd1","5":"#1f9e9a","6":"#3c6fd1"},"cats":[{"name":"학사","color":"#2f5bd3"},{"name":"행사","color":"#e0732e"},{"name":"평가","color":"#c0392b"},{"name":"연수·회의","color":"#7d5ba6"},{"name":"방학·휴업","color":"#3a9d5d"},{"name":"기타","color":"#6b7280"}],"staff":[],"print":{"approvals":["담당","부장","교감","교장"]},"events":[]}</script>
<script id="appscript">
(function(){
"use strict";
const DAYS=['일','월','화','수','목','금','토'];
const DEFAULT_COLORS={"0":"#e0524f","1":"#e0a018","2":"#e9692c","3":"#3ba55c","4":"#8a5cd1","5":"#1f9e9a","6":"#3c6fd1"};
const LSKEY='school-events-v3';
const DEFAULTS=JSON.parse(document.getElementById('appdata').textContent);
const CFG_KEYS=['schoolName','colors','cats','staff','print'];
const $main=document.getElementById('main'),$ov=document.getElementById('overlay'),$toast=document.getElementById('toast');
let data=migrate(JSON.parse(JSON.stringify(DEFAULTS)));

/* ---------- 공휴일 (참고용, 2026~2027) ---------- */
const HOLIDAYS={
"2026-01-01":"신정","2026-02-16":"설날 연휴","2026-02-17":"설날","2026-02-18":"설날 연휴","2026-03-01":"삼일절","2026-03-02":"대체공휴일","2026-05-05":"어린이날","2026-05-24":"부처님오신날","2026-05-25":"대체공휴일","2026-06-03":"지방선거일","2026-06-06":"현충일","2026-08-15":"광복절","2026-08-17":"대체공휴일","2026-09-24":"추석 연휴","2026-09-25":"추석","2026-09-26":"추석 연휴","2026-10-03":"개천절","2026-10-05":"대체공휴일","2026-10-09":"한글날","2026-12-25":"성탄절",
"2027-01-01":"신정","2027-02-06":"설날 연휴","2027-02-07":"설날","2027-02-08":"설날 연휴","2027-02-09":"대체공휴일","2027-03-01":"삼일절","2027-05-05":"어린이날","2027-05-13":"부처님오신날","2027-06-06":"현충일","2027-08-15":"광복절","2027-08-16":"대체공휴일","2027-09-14":"추석 연휴","2027-09-15":"추석","2027-09-16":"추석 연휴","2027-10-03":"개천절","2027-10-04":"대체공휴일","2027-10-09":"한글날","2027-10-11":"대체공휴일","2027-12-25":"성탄절","2027-12-27":"대체공휴일"};

/* ---------- 상태 ---------- */
const S={view:'month',cur:new Date(),monthMode:'table',onlyEvents:false,q:'',cat:'',mine:false,yearMode:'school',modal:null,ev:null,wk:null,setTab:'basic',imp:null,pr:null,del:null,lastDel:null,toast:null,flashId:null};
const P={live:false,owner:false,me:null,myName:'',canWrite:true,role:'',loading:false};
let db=null,downloads=null,userNs=null,statusMsg='',statusErr=false,writeQ=Promise.resolve(),pendingWrites=0;

/* ---------- 도우미 ---------- */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
const todayStr=ymd(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const uid=(p)=>(p||'e')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const color=w=>(data.colors&&data.colors[w])||DEFAULT_COLORS[w];
const tint=(hex,a)=>{const h=hex.replace('#','');return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`};
const catColor=n=>{const c=(data.cats||[]).find(c=>c.name===n);return c?c.color:'#6b7280'};
const endOf=e=>e.end||e.date;
const staffById=id=>data.staff.find(s=>s.id===id);
function ownerNames(e){return e.owner||''}
function migrate(d){
  d.colors=d.colors||{...DEFAULT_COLORS};d.cats=d.cats||[];d.staff=d.staff||[];d.events=d.events||[];
  d.print=d.print||{approvals:['담당','부장','교감','교장']};
  d.events.forEach(e=>{
    migrateEv(e,d.staff);
  });
  return d;
}
function migrateEv(e,staff){
  if(Array.isArray(e.owners)){const n=e.owners.map(id=>{const s=(staff||[]).find(s=>s.id===id);return s?s.name:''}).filter(Boolean);if(e.ownerText)n.push(e.ownerText);e.owner=[e.owner,...n].filter(Boolean).join(', ')}
  delete e.owners;delete e.ownerText;e.owner=e.owner||'';if(e.end&&e.end<=e.date)delete e.end;return e;
}

/* ---------- 해시 라우팅 ---------- */
function schoolYearOf(d){return S.yearMode==='cal'?d.getFullYear():(d.getMonth()<2?d.getFullYear()-1:d.getFullYear())}
function readHash(){
  const h=location.hash.slice(1);let m;
  if((m=h.match(/^m-(\d{4})-(\d{2})$/))){S.view='month';S.cur=new Date(+m[1],+m[2]-1,1)}
  else if((m=h.match(/^w-(\d{4})-(\d{2})-(\d{2})$/))){S.view='week';S.cur=new Date(+m[1],+m[2]-1,+m[3])}
  else if((m=h.match(/^y-(\d{4})$/))){S.view='year';S.yearMode='school';S.cur=new Date(+m[1],2,1)}
  else if((m=h.match(/^ya-(\d{4})$/))){S.view='year';S.yearMode='cal';S.cur=new Date(+m[1],0,1)}
}
function writeHash(){
  let h;const d=S.cur;
  if(S.view==='month')h='m-'+d.getFullYear()+'-'+pad(d.getMonth()+1);
  else if(S.view==='week')h='w-'+ymd(monStart(d));
  else h=(S.yearMode==='cal'?'ya-':'y-')+schoolYearOf(d);
  if(location.hash.slice(1)!==h){try{history.replaceState(null,'','#'+h)}catch(e){location.hash=h}}
}

/* ---------- 필터 ---------- */
function matches(e){
  if(S.cat&&e.cat!==S.cat)return false;
  if(S.mine&&P.myName&&!String(e.owner||'').replace(/\s/g,'').includes(P.myName))return false;
  if(S.q){const q=S.q.toLowerCase();return[e.title,e.place,e.note,e.time,e.cat,ownerNames(e)].some(v=>String(v||'').toLowerCase().includes(q))}
  return true;
}
const byTime=(a,b)=>String(a.time||'').localeCompare(String(b.time||''),'ko',{numeric:true});
function eventsOn(ds){return data.events.filter(e=>e.date<=ds&&ds<=endOf(e)&&matches(e)).sort((a,b)=>(a.end?0:1)-(b.end?0:1)||byTime(a,b))}
const filtering=()=>!!(S.q||S.cat||S.mine);

/* ---------- 메인 화면 ---------- */
function render(){renderMain();renderOverlay();renderToast()}
function renderMain(){
  writeHash();document.title=orgTitle();
  document.body.classList.toggle('ro',!P.canWrite);
  let label='',body='';const d=S.cur;
  if(S.view==='month'){label=`${d.getFullYear()}년 ${d.getMonth()+1}월`;body=S.monthMode==='table'?renderTable(monthDays()):renderGrid()}
  else if(S.view==='week'){const s=monStart(d),e=addDays(s,6);label=`${s.getMonth()+1}.${s.getDate()} ~ ${e.getMonth()+1}.${e.getDate()} (${weekNo(s)})`;body=renderTable(weekDays(),true)}
  else{const y=schoolYearOf(d);label=S.yearMode==='cal'?`${y}년`:`${y}학년도 (${y}.3 ~ ${y+1}.2)`;body=renderYear()}
  const who=P.live&&P.role?`<span class="who ${P.canWrite?'':'ro'}">${esc((P.me&&P.me.name)||'나')} · ${esc(P.role)}</span>`:'';
  $main.innerHTML=`<div class="wrap">
  <header class="top"><div><div class="school">${S.view==='month'?'월간':S.view==='week'?'주간':'연간'} 일정</div><h1>${titleHtml()}</h1></div>
  <div class="row"><span class="status ${statusErr?'err':''}">${esc(statusMsg)}</span>${who}<button class="btn primary edit-only" data-act="addtop">+ 행사 추가</button><button class="btn" data-act="print">🖨 A4 인쇄</button><button class="btn" data-act="sheets">📊 구글 시트</button><button class="btn" data-act="settings">⚙ 설정</button>${installEvt?'<button class="btn" data-act="install">📲 앱 설치</button>':''}</div></header>
  <div class="bar">
   <div class="seg">${[['month','월간'],['week','주간'],['year','연간']].map(([v,t])=>`<button data-act="view" data-v="${v}" class="${S.view===v?'on':''}">${t}</button>`).join('')}</div>
   <div class="nav"><button class="btn icon" data-act="prev" aria-label="이전">◀</button><div class="label">${label}</div><button class="btn icon" data-act="next" aria-label="다음">▶</button><button class="btn" data-act="today">오늘</button></div>

/* ----- 반복 날짜 생성 ----- */
function genDates(start,r){
  const out=[],s=parse(start),until=parse(r.until&&r.until>=start?r.until:start),max=400;
  const ok=d=>!(r.skipHol&&HOLIDAYS[ymd(d)]);
  if(r.freq==='weekly'){
    const days=r.days.length?r.days:[s.getDay()];let ws=monStart(s),k=0;
    while(ws<=until&&out.length<max){if(k%(+r.interval||1)===0)for(let off=0;off<7;off++){const d=addDays(ws,off);if(days.includes(d.getDay())&&d>=s&&d<=until&&ok(d))out.push(ymd(d))}ws=addDays(ws,7);k++}
  }else if(r.freq==='monthly-date'){
    const day=s.getDate();for(let m=0;m<120&&out.length<max;m++){const d=new Date(s.getFullYear(),s.getMonth()+m,day);if(d.getDate()!==day){if(new Date(s.getFullYear(),s.getMonth()+m,1)>until)break;continue}if(d>until)break;if(ok(d))out.push(ymd(d))}
  }else if(r.freq==='monthly-nth'){
    const wd=s.getDay(),nth=Math.ceil(s.getDate()/7);
    for(let m=0;m<120&&out.length<max;m++){const y=s.getFullYear(),mo=s.getMonth()+m;let d;
      if(nth<5){const f=new Date(y,mo,1);d=new Date(y,mo,1+((wd-f.getDay()+7)%7)+(nth-1)*7)}else{const l=new Date(y,mo+1,0);d=new Date(y,mo,l.getDate()-((l.getDay()-wd+7)%7))}
      if(d>until)break;if(d>=s&&ok(d))out.push(ymd(d))}
  }
  return out;
}

function loadXLSX(){if(window.XLSX)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('xlsx'));document.head.appendChild(s)})}
function parseCSV(t,delim){
  delim=delim||',';const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"'&&f==='')q=true;else if(ch===delim){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
async function readRows(file){
  const name=file.name.toLowerCase(),buf=await file.arrayBuffer();
  if(/\.(xlsx|xls|xlsm|ods)$/.test(name)){
    try{await loadXLSX()}catch(e){throw new Error('엑셀 읽기 도구를 불러오지 못했습니다. 엑셀에서 "CSV UTF-8"로 저장해 올려 주세요.')}
    const wb=XLSX.read(new Uint8Array(buf),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    return {rows:XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})};
  }
  let text=new TextDecoder('utf-8').decode(buf);
  if(text.includes('\uFFFD')){try{text=new TextDecoder('euc-kr').decode(buf)}catch(e){}}
  text=text.replace(/^\ufeff/,'');
  if(/\.json$/.test(name))return {json:JSON.parse(text)};
  const first=text.split(/\r?\n/)[0]||'';
  return {rows:parseCSV(text,first.includes('\t')&&!first.includes(',')?'\t':',')};
}

/* ----- 일정 가져오기 (NEIS 등) ----- */
const IMP_FIELDS=[['date','날짜(시작일) *'],['end','종료일'],['title','행사명 *'],['cat','구분'],['time','시간'],['place','장소'],['owner','담당자'],['note','비고'],['sub','수업공제일명(휴업일 판별)']];
const IMP_RE={sub:[/수업\s*공제/],end:[/종료|까지|end/i,/일자|일$|date/i],date:[/학사\s*일자|^일자$|날짜|시작|일시|^date$|ymd|일자/i,null,/수정|등록|종료|요일/],
  title:[/행사명|일정명|학사\s*일정|행사|제목|title|event_nm/i,null,/내용|여부|코드/],note:[/비고|행사\s*내용|내용|메모|note/i,null,/여부/],cat:[/구분|분류|카테고리/,null,/공제/],time:[/시간|time/i],place:[/장소|place/i],owner:[/담당/]};
function guessMap(header){
  const map={},used=new Set();const H=header.map(h=>String(h||'').trim());
  for(const k of ['sub','end','date','title','note','cat','time','place','owner']){
    const [re,re2,ex]=IMP_RE[k];
    const i=H.findIndex((h,j)=>!used.has(j)&&h&&re.test(h)&&(!re2||re2.test(h))&&!(ex&&ex.test(h)));
    map[k]=i;if(i>=0)used.add(i);
  }
  map.grades=H.map((h,j)=>{const m=h.match(/([1-6])\s*학년.*여부/);return m?{col:j,n:+m[1]}:null}).filter(Boolean);
  return map;
}
function detectHeader(rows){
  for(let i=0;i<Math.min(rows.length,15);i++){const r=rows[i].map(c=>String(c||''));if(r.some(c=>/일자|날짜|시작일|date/i.test(c))&&r.some(c=>/행사|일정|제목|title/i.test(c)))return i}
  return -1;
}
function startImport(name,rows){
  rows=rows.map(r=>Array.isArray(r)?r:[]);
  const h=detectHeader(rows);
  const now=new Date(),sy=now.getMonth()<2?now.getFullYear()-1:now.getFullYear();
  const map=h>=0?guessMap(rows[h]):{date:0,end:1,cat:3,title:4,time:5,place:6,owner:7,note:8,sub:-1,grades:[]};
  if(h<0&&rows[0]&&rows[0].length<6)Object.assign(map,{date:0,end:-1,cat:-1,title:1,time:-1,place:-1,owner:-1,note:2});
  S.imp={name,rows,h,map,opt:{skipSat:true,merge:true,defCat:data.cats.some(c=>c.name==='학사')?'학사':(data.cats[0]||{}).name||'',year:sy}};
  S.modal='import';renderOverlay();
}
function parseDateCell(v,sy){
  if(v==null||v==='')return[null,null];
  if(typeof v==='number'){
    if(v>19000000&&v<30000000){const s=String(Math.round(v));return[s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8),null]}
    if(v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return[d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()),null]}
    return[null,null];
  }
  const one=(t,ref)=>{t=String(t||'').trim();let m;
    if((m=t.match(/^(\d{4})(\d{2})(\d{2})$/)))return m[1]+'-'+m[2]+'-'+m[3];
    if((m=t.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/)))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
    if((m=t.match(/^(\d{1,2})\s*[-./월]\s*(\d{1,2})/))){const mo=+m[1];let y=ref?+ref.slice(0,4):(mo>=3?sy:sy+1);if(ref&&mo<+ref.slice(5,7))y++;return y+'-'+pad(mo)+'-'+pad(m[2])}
    if(ref&&(m=t.match(/^(\d{1,2})\s*일?$/)))return ref.slice(0,8)+pad(m[1]);
    return null};
  const parts=String(v).trim().split(/\s*[~∼～]\s*|\s+-\s+/);
  const a=one(parts[0]);return[a,parts[1]&&a?one(parts[1],a):null];
}
function isOffDay(d){const w=d.getDay();return w===0||w===6||!!HOLIDAYS[ymd(d)]}
function gapOnlyOff(a,b){let d=addDays(parse(a),1);const B=parse(b);if((B-d)/864e5>4)return false;while(d<B){if(!isOffDay(d))return false;d=addDays(d,1)}return true}
function convertImport(){
  const {rows,h,map,opt}=S.imp,out=[];
  const get=(r,k)=>map[k]>=0&&r[map[k]]!=null?String(r[map[k]]).trim():'';
  const catNames=new Set(data.cats.map(c=>c.name));
  for(let i=h+1;i<rows.length;i++){const r=rows[i];if(!r)continue;
    const title=get(r,'title');if(!title)continue;
    if(opt.skipSat&&/토요\s*휴업/.test(title))continue;
    const [d1,d2]=parseDateCell(map.date>=0?r[map.date]:'',+opt.year);if(!d1)continue;
    let end=map.end>=0?parseDateCell(r[map.end],+opt.year)[0]:d2;
    let cat=get(r,'cat');const sub=get(r,'sub');
    if(!cat)cat=(/휴업/.test(sub)||/방학|휴업|재량/.test(title))&&catNames.has('방학·휴업')?'방학·휴업':opt.defCat;
    let note=get(r,'note');if(note===title)note='';
    if(map.grades.length){const ys=map.grades.filter(g=>/^(y|yes|예|o|1|●|○|v)$/i.test(String(r[g.col]||'').trim())).map(g=>g.n);if(ys.length&&ys.length<map.grades.length)note=(note?note+' / ':'')+'대상: '+ys.join('·')+'학년'}
    out.push({date:d1,end:end&&end>d1?end:'',title,cat,time:get(r,'time'),place:get(r,'place'),note,owner:get(r,'owner').split(/\s*[,·\/]\s*/).filter(Boolean).join(', ')});
  }
  let list=out;
  if(opt.merge){
    const key=e=>[e.title,e.cat,e.time,e.place,e.note,e.owner].join('|'),groups=new Map();
    list.forEach(e=>{const k=key(e);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});
    list=[];for(const g of groups.values()){g.sort((a,b)=>a.date.localeCompare(b.date));let cur=null;
      for(const e of g){if(cur){const ce=cur.end||cur.date,ee=e.end||e.date;if(e.date<=ce||e.date===ymd(addDays(parse(ce),1))||gapOnlyOff(ce,e.date)){if(ee>ce)cur.end=ee;continue}}cur={...e};list.push(cur)}}
  }

  list=list.filter(e=>{const k=e.date+'|'+e.title;if(have.has(k)||seen.has(k)){dup++;return false}seen.add(k);return true}).sort((a,b)=>a.date.localeCompare(b.date));
  return{list,dup};
}
function renderImport(){
  const I=S.imp,header=I.h>=0?I.rows[I.h]:[];const ncol=Math.max(...I.rows.slice(0,30).map(r=>r.length),1);
  const letter=j=>{let s='';j++;while(j){s=String.fromCharCode(65+(j-1)%26)+s;j=Math.floor((j-1)/26)}return s};
  const colOpts=sel=>`<option value="-1">(없음)</option>`+Array.from({length:ncol},(_,j)=>`<option value="${j}" ${sel===j?'selected':''}>${letter(j)}열${header[j]?' · '+esc(String(header[j]).slice(0,14)):''}</option>`).join('');
  const {list,dup}=convertImport();

let mcpNs=null;
async function sendToDrive(){
  const list=sheetsScope();if(!list.length)return;
  S.sh.busy=true;S.sh.msg='';S.sh.link='';renderOverlay();
  try{
    if(!mcpNs)mcpNs=await Promise.resolve(window.claude.use('mcp')).catch(()=>null);
    if(!mcpNs)throw{code:'not_granted'};
    const t=new Date(),title=`${data.schoolName?data.schoolName+' ':''}일정표 (${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())} 내보냄)`;
    const csv=sheetRows(list).map(r=>r.map(cq).join(',')).join('\r\n');
    const res=await mcpNs.callTool('Google Drive','create_file',{title,textContent:csv,contentMimeType:'text/csv'});
    let pl=res&&res.payload;if(typeof pl==='string'){try{pl=JSON.parse(pl)}catch(e){}}
    const f=pl&&(pl.file||pl)||{};const id=f.id||f.fileId;
    S.sh.link=f.webViewLink||f.alternateLink||(id?`https://docs.google.com/spreadsheets/d/${id}/edit`:'');
    if(!S.sh.link)S.sh.msg='스프레드시트를 만들었습니다. 구글 드라이브에서 확인하세요.';
    toast('구글 스프레드시트를 만들었습니다');
  }catch(e){
    const c=e&&e.code;
    S.sh.msg=c==='server_not_connected'?'claude.ai 설정 › 커넥터에서 Google Drive를 연결한 뒤 다시 눌러 주세요.'
      :c==='needs_reauth'?'Google Drive 연결이 만료되었습니다. claude.ai 설정 › 커넥터에서 다시 연결해 주세요.'
      :c==='approval_required'||c==='not_in_manifest'?'구글 드라이브 사용을 허용해야 만들 수 있습니다. 다시 누르면 허용 여부를 묻습니다.'
      :c==='not_granted'||c==='capability_disabled'?'이 화면에서는 구글 드라이브 연동을 쓸 수 없습니다. 엑셀로 받아 드라이브에 올려 주세요.'
      :c==='server_unavailable'||c==='upstream_error'?'구글 드라이브가 응답하지 않았습니다. 드라이브에 이미 만들어졌는지 확인한 뒤 다시 시도해 주세요.'
      :'만들지 못했습니다'+(e&&e.message?': '+e.message:'');
  }finally{S.sh.busy=false;renderOverlay()}
}

/* ----- 구글 시트(Apps Script) 저장소: 설치형에서 사용 ----- */
const GSKEY='school-cal-gs-url';
const gsUrl=()=>{try{return localStorage.getItem(GSKEY)||''}catch(e){return''}};
(function(){try{if(IN_CLAUDE)return;const q=new URLSearchParams(location.search).get('sheet');if(q&&/^https:\/\/script\.google(usercontent)?\.com\//.test(q)){localStorage.setItem(GSKEY,q);history.replaceState(null,'',location.pathname+location.hash)}}catch(e){}})();
const shareLink=()=>location.origin+location.pathname+'?sheet='+encodeURIComponent(gsUrl());
let gsTimer=null;
async function gsLoad(quiet){
  const url=gsUrl();if(!url)return false;
  if(pendingWrites)return true;
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'action=load&t='+Date.now());const j=await r.json();
    if(!j.ok)throw new Error(j.error||'응답 오류');
    if(pendingWrites)return true;
    if(j.config)CFG_KEYS.forEach(k=>{if(j.config[k]!=null)data[k]=j.config[k]});
    data.events=(j.events||[]).map(e=>{const c=cleanEv(migrateEv({...e},data.staff));if(e.sample)c.sample=true;if(!c.series)delete c.series;return c}).filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&e.title);
    S.sheetUrl=j.sheetUrl||'';if(!quiet||statusErr)setStatus('구글 시트와 연결됨');
    renderMain();if(S.modal==='sheets')renderOverlay();return true;
  }catch(e){setStatus('구글 시트에 연결하지 못했습니다 — 주소와 배포 설정을 확인해 주세요',true);return false}
}
function gsStartPolling(){clearInterval(gsTimer);gsTimer=setInterval(()=>{if(document.visibilityState==='visible')gsLoad(true)},30000)}
async function gsPost(body){
  const r=await fetch(gsUrl(),{method:'POST',body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.error||'저장 실패');return j;
}

/* ---------- 저장 (공유 DB) ---------- */
function setStatus(m,err){statusMsg=m;statusErr=!!err;const el=$main.querySelector('.status');if(el){el.textContent=m;el.classList.toggle('err',!!err)}}
function cfgBody(){const o={};CFG_KEYS.forEach(k=>o[k]=JSON.parse(JSON.stringify(data[k])));return o}
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(data))}catch(e){}}
function persist({put=[],del=[],config=false}){
  const ds=new Set(del),pm=new Map(put.map(e=>[e.id,e]));
  data.events=data.events.filter(e=>!ds.has(e.id)&&!pm.has(e.id)).concat(put);
  if(!db&&gsUrl()){
    saveLocal();const body={action:'sync',put,del};if(config)body.config=cfgBody();
    pendingWrites++;setStatus('구글 시트에 저장 중…');
    writeQ=writeQ.then(()=>gsPost(body)).then(()=>{pendingWrites--;if(!pendingWrites){statusErr=false;setStatus('구글 시트에 저장됨')}},e=>{pendingWrites--;setStatus('구글 시트 저장 실패 — 인터넷 연결을 확인해 주세요 ('+(e.message||e)+')',true)});
    return;
  }
  if(!db){saveLocal();setStatus('이 브라우저에 저장됨');return}
  const ops=[];
  put.forEach(e=>{const body={...e};delete body.id;ops.push(()=>db.collection('events').doc(e.id).set(body))});
  del.forEach(id=>ops.push(()=>db.collection('events').doc(id).delete()));
  if(config){const b=cfgBody();ops.push(()=>db.doc('config/main').set(b))}
  if(!ops.length)return;
  pendingWrites+=ops.length;setStatus(`저장 중… (${pendingWrites})`);
  ops.forEach(op=>{writeQ=writeQ.then(()=>runWrite(op)).catch(()=>{})});
}
async function runWrite(op){
  try{await op()}catch(e){
    const code=e&&e.code;
    if(code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*800));try{await op()}catch(e2){fail(e2)}}
    else fail(e);
  }finally{pendingWrites=Math.max(0,pendingWrites-1);if(!pendingWrites&&!statusErr)setStatus('저장됨')}
}
function fail(e){
  const code=e&&e.code;
  if(code==='invalid_argument'||code==='revoked'||code==='not_granted'){if(P.canWrite){P.canWrite=false;P.role='보기 전용';setStatus('저장 권한이 없어 저장되지 않았습니다',true);render()}}
  else if(code==='quota_exceeded')setStatus('저장 공간이 가득 찼습니다. 지난 일정을 정리해 주세요.',true);
  else if(code==='resource_exhausted')setStatus('한꺼번에 너무 많이 저장하고 있어요. 잠시 후 다시 시도해 주세요.',true);
  else setStatus('저장 실패 — 잠시 후 다시 시도해 주세요'+(code?' ('+code+')':''),true);
}
let gotEvents=false,gotConfig=false,loadTimer=null;
function connectDb(){
  P.loading=true;renderMain();
  loadTimer=setTimeout(()=>{if(P.loading){P.loading=false;setStatus('공유 데이터에 아직 연결되지 않았습니다. 잠시 후 저절로 다시 시도합니다.',true);renderMain()}},10000);
  const done=()=>{if(gotEvents&&gotConfig&&P.loading){P.loading=false;clearTimeout(loadTimer);if(statusErr&&!pendingWrites)setStatus('');renderMain()}};
  db.collection('events').onSnapshot(qs=>{
    data.events=qs.docs.map(d=>{const b=d.data()||{};const e=cleanEv({...migrateEv({...b},data.staff),id:d.id});if(b.sample)e.sample=true;return e}).filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&e.title);
    if(!qs.metadata.fromCache)gotEvents=true;done();if(!P.loading)renderMain();
  },err=>{gotEvents=true;P.loading=false;clearTimeout(loadTimer);setStatus('일정을 불러오지 못했습니다 ('+(err&&err.code)+')',true);renderMain()});
  db.doc('config/main').onSnapshot(snap=>{
    const b=snap.exists?snap.data():null,src=b||DEFAULTS;
    CFG_KEYS.forEach(k=>{data[k]=src[k]!=null?JSON.parse(JSON.stringify(src[k])):JSON.parse(JSON.stringify(DEFAULTS[k]))});
    if(!snap.metadata.fromCache)gotConfig=true;done();if(!P.loading)renderMain();
  },err=>{gotConfig=true;done()});
}

/* ---------- 권한 ---------- */
async function loadPerm(){
  P.live=true;P.canWrite=true;P.role='';
  if(!userNs)return;
  try{
    const[me,own,can]=await Promise.all([userNs.me(),userNs.isOwner(),userNs.can('data.write')]);
    P.me=me;P.owner=!!own;P.myName=String((me&&me.name)||'').replace(/\s/g,'');
    if(P.owner){P.canWrite=true;P.role='소유자'}
    else if(can===false){P.canWrite=false;P.role='보기 전용'}
    else{P.canWrite=true;P.role='편집 가능'}
  }catch(e){}
}

  case'staffpaste':{const ta=document.getElementById('staffPaste');const txt=(ta&&ta.value)||'';if(!txt.trim()){toast('붙여넣을 내용을 입력해 주세요');break}
    const rows=txt.split(/\r?\n/).map(l=>l.split(l.includes('\t')?'\t':','));addStaff(staffFromRows(rows));break}
  case'csv':saveFile(`${fileBase()}_${location.hash.slice(1)||'view'}.csv`,toCSV(viewEvents()));break;
  case'csvall':saveFile(`${fileBase()}_전체.csv`,toCSV(data.events));break;
  case'json':saveFile(`${fileBase()}_백업.json`,JSON.stringify(data,null,2));break;
  case'impdo':doImport();break;
  case'print':openPrint();break;
  case'prlayout':S.pr.layout=t.dataset.v;renderOverlay();break;
  case'prdl':{const labs=String(S.pr.appr||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    if(P.canWrite&&labs.join()!==(data.print.approvals||[]).join()){data.print.approvals=labs;persist({config:true})}
    const ms=prMonths();saveFile(`${fileBase()}_${ms[0].getFullYear()}-${pad(ms[0].getMonth()+1)}${ms.length>1?'_'+ms.length+'개월':''}_A4가로.html`,printDoc(),'인쇄용 파일을 저장했습니다 — 열면 인쇄 창이 뜹니다');break}
  }
});
function blankEv(ds){return{id:uid(),date:ds,end:'',cat:'',title:'',time:'',place:'',owner:'',note:''}}
function closeModal(){S.modal=null;S.ev=null;S.wk=null;S.imp=null;renderOverlay()}
document.addEventListener('dblclick',ev=>{const tr=ev.target.closest('tr[data-id]');if(!tr||!P.canWrite||ev.target.closest('button'))return;const e=data.events.find(x=>x.id===tr.dataset.id);if(e)openEvent(e,false)});
document.addEventListener('input',ev=>{
  const t=ev.target,ds=t.dataset;
  if(ds.act==='q'){S.q=t.value;if(ev.isComposing)return;S._focusQ=true;renderMain();return}
  if(ds.ev&&S.ev){S.ev[ds.ev]=t.value;return}
  if(S.wk){
    if(ds.wk){S.wk[ds.wk]=t.value;return}
    if(ds.wkcolor!=null){S.wk.colors={...S.wk.colors,[ds.wkcolor]:t.value};const l=t.closest('label');if(l)l.style.color=t.value;return}
    if(ds.wkcatn!=null){S.wk.cats[+ds.wkcatn].name=t.value;return}
    if(ds.wkcatc!=null){S.wk.cats[+ds.wkcatc].color=t.value;return}
    if(ds.wkstaff&&t.type!=='checkbox'){const [i,f]=ds.wkstaff.split(':');S.wk.staff[+i][f]=t.value;return}
  }
  if(ds.pr&&S.pr&&t.type!=='checkbox'&&ds.pr==='appr'){S.pr.appr=t.value}
});
document.addEventListener('compositionend',ev=>{if(ev.target.dataset.act==='q'){S.q=ev.target.value;S._focusQ=true;renderMain()}});
document.addEventListener('change',async ev=>{
  const t=ev.target,ds=t.dataset;
  if(ds.act==='only'){S.onlyEvents=t.checked;renderMain();return}
  if(ds.act==='mine'){S.mine=t.checked;renderMain();return}
  if(ds.act==='catf'){S.cat=t.value;renderMain();return}
  if(S.ev){
    if(ds.ev==='date'){S.ev.date=t.value;if(S.ev.end&&S.ev.end<t.value)S.ev.end='';if(S.ev.rep.days.length<=1)S.ev.rep.days=[parse(t.value).getDay()];if(S.ev.rep.until<t.value)S.ev.rep.until=schoolYearEnd(t.value);renderOverlay();return}
    if(ds.rep){const r=S.ev.rep;r[ds.rep]=t.type==='checkbox'?t.checked:t.value;renderOverlay();return}
    if(ds.repday!=null){const w=+ds.repday,r=S.ev.rep;r.days=t.checked?[...new Set([...r.days,w])]:r.days.filter(x=>x!==w);renderOverlay();return}
    if(t.name==='scope'){S.ev.scope=t.value;return}
  }
  if(S.wk&&ds.wkstaff&&t.type==='checkbox'){const [i,f]=ds.wkstaff.split(':');S.wk.staff[+i][f]=t.checked;return}
  if(S.imp&&ds.imp){
    if(ds.imp==='h'){S.imp.h=+t.value;if(S.imp.h>=0)S.imp.map=guessMap(S.imp.rows[S.imp.h])}
    else{const [g,k]=ds.imp.split('.');S.imp[g][k]=t.type==='checkbox'?t.checked:(g==='map'?+t.value:t.value)}
    renderOverlay();return}
  if(S.pr&&ds.pr){S.pr[ds.pr]=t.type==='checkbox'?t.checked:t.value;if(ds.pr==='from'&&S.pr.to<S.pr.from)S.pr.to=S.pr.from;renderOverlay();return}
  if(t.id==='staffFile'&&t.files[0]){try{const r=await readRows(t.files[0]);if(!r.rows)throw new Error('지원하지 않는 파일입니다');addStaff(staffFromRows(r.rows))}catch(e){toast(e.message||'파일을 읽을 수 없습니다')}return}
  if(t.id==='evFile'&&t.files[0]){const f=t.files[0];try{const r=await readRows(f);if(r.json){importBackup(r.json);return}if(!r.rows.length)throw new Error('빈 파일입니다');startImport(f.name,r.rows)}catch(e){toast(e.message||'파일을 읽을 수 없습니다')}return}
});
document.addEventListener('keydown',ev=>{
  if(ev.target.id==='ttlInput'&&!ev.isComposing){if(ev.key==='Enter'){ev.preventDefault();saveTitle(ev.target.value);return}if(ev.key==='Escape'){S.editTitle=false;renderMain();return}}
  if(ev.key==='Escape'&&S.modal){closeModal();return}
  if(ev.key==='Enter'&&S.modal==='event'&&!ev.isComposing&&ev.target.matches('[data-ev]:not(textarea)')){ev.preventDefault();const f=ev.target;S.ev[f.dataset.ev]=f.value;saveEvent()}
});
window.addEventListener('hashchange',()=>{readHash();renderMain()});
document.addEventListener('focusout',ev=>{if(ev.target.id==='ttlInput'&&S.editTitle)saveTitle(ev.target.value)});
let installEvt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;renderMain()});
if(!IN_CLAUDE&&location.protocol==='https:'&&'serviceWorker' in navigator){try{const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

/* ---------- 시작 ---------- */
readHash();render();
(async()=>{
  const use=window.claude&&typeof window.claude.use==='function'?n=>Promise.resolve(window.claude.use(n)).catch(()=>null):null;
  if(use){[db,downloads,userNs]=await Promise.all([use('db'),use('downloads'),use('user')])}
  if(!db){
    try{const l=JSON.parse(localStorage.getItem(LSKEY)||'null');if(l&&l.events)data=migrate(l)}catch(e){}
    P.live=false;P.canWrite=true;
    if(gsUrl()){setStatus('구글 시트에서 불러오는 중…');render();if(await gsLoad())gsStartPolling();return}
    setStatus(IN_CLAUDE?'미리보기 — 이 브라우저에만 저장됩니다':'이 브라우저에 저장됩니다 · 여럿이 함께 쓰려면 📊 구글 시트 연결');render();return;
  }
  await loadPerm();connectDb();render();
})();
})();
</script></body></html>
